<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Video Subtitles Automation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg:          #09090c;
    --surface:     #111118;
    --panel:       #14141c;
    --border:      #252530;
    --border-hi:   #333342;
    --primary:     #4b7cf9;
    --primary-dim: rgba(75,124,249,0.12);
    --text:        #ebebf2;
    --text-muted:  #9898b2;
    --error:       #ef4444;
    --radius:      12px;
}

html[data-theme="light"] {
    --bg:         #f4f4f8;
    --surface:    #ffffff;
    --panel:      #eeeef5;
    --border:     #d8d8e6;
    --border-hi:  #c4c4d8;
    --text:       #0d0d14;
    --text-muted: #4a4a62;
}

body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
}

.card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2.5rem 2rem;
    box-shadow: 0 24px 80px rgba(0,0,0,0.4);
}

.logo {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1.75rem;
}

.logo-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, #4b7cf9, #7c5cf7);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
}

.logo-text { font-size: 0.95rem; font-weight: 700; }
.logo-sub  { font-size: 0.72rem; color: var(--text-muted); margin-top: 1px; }

h1 {
    font-size: 1.35rem;
    font-weight: 700;
    margin-bottom: 0.35rem;
}

.subtitle {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-bottom: 1.75rem;
}

label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 0.4rem;
}

input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.85rem;
    background: var(--panel);
    border: 1.5px solid var(--border-hi);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 0.9rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
}

input[type="password"]:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(75,124,249,0.15);
}

.error-box {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
    font-size: 0.8rem;
    color: var(--error);
    margin-top: 0.75rem;
}

button[type="submit"] {
    width: 100%;
    margin-top: 1.25rem;
    padding: 0.7rem;
    background: linear-gradient(135deg, #4b7cf9, #6d5ef7);
    border: none;
    border-radius: var(--radius);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.15s;
}

button[type="submit"]:hover  { opacity: 0.9; transform: translateY(-1px); }
button[type="submit"]:active { transform: translateY(0); }
</style>
</head>
<body>
<div class="card">
    <div class="logo">
        <div class="logo-icon">🎬</div>
        <div>
            <div class="logo-text">Video Subtitles</div>
            <div class="logo-sub">Automation</div>
        </div>
    </div>

    <h1>Sign in</h1>
    <p class="subtitle">Enter your password to continue.</p>

    <form method="post" action="/login">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="••••••••" autofocus autocomplete="current-password">

        {% if error %}
        <div class="error-box">
            ⚠ {{ error }}
        </div>
        {% endif %}

        <button type="submit">Sign in →</button>
    </form>
</div>
</body>
</html>
